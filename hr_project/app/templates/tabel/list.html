{% extends "base.html" %}
{% block title %}{{ t('tabel_page_title') }}{% endblock %}
{% block page_title %}{{ t('tabel_page_title') }}{% endblock %}
{% block content %}

<div id="tabelPeriodGrid"></div>

{% endblock %}

{% block extra_scripts %}
<script>
document.addEventListener("DOMContentLoaded", function () {
  const canAdd = {{ 'true' if current_user.has_perm('TABEL', 'can_add') else 'false' }};
  const canEdit = {{ 'true' if current_user.has_perm('TABEL', 'can_edit') or current_user.has_perm('TABEL', 'can_view') else 'false' }};
  const canDelete = {{ 'true' if current_user.has_perm('TABEL', 'can_delete') else 'false' }};

  createAdvancedGrid("tabelPeriodGrid", "tabel_periods", {
    ajaxURL: "{{ url_for('tabel.api_periods') }}",
    pagination: true,
    paginationSize: 20,
    placeholder: "{{ t('no_data_generic') }}",
    columns: [
      { title: "{{ t('tabel_col_period') }}", field: "label", headerFilter: "input" },
      { title: "{{ t('tabel_col_confirmed') }}", field: "is_approved", width: 110, formatter: "tickCross" }
    ]
  }, {
    idField: "id",
    addUrl: canAdd ? "{{ url_for('tabel.add_period') }}" : null,
    editUrlTemplate: canEdit ? "/tabel/edit/{id}" : null,
    deleteUrlTemplate: canDelete ? "/tabel/{id}/delete" : null,
  });
});
</script>
{% endblock %}
