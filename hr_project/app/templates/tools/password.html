{% extends "base.html" %}
{% block title %}Parolu dəyiş{% endblock %}
{% block page_title %}{{ t('change_password') }}{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;">
{% if current_user.must_change_password %}
<div class="flash flash-warning">Sizə standart parol təyin olunub. Zəhmət olmasa parolunuzu dəyişin.</div>
{% endif %}
<form method="post" class="simple-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Cari parol</label>
  <input type="password" name="current_password" required>
  <label>Yeni parol</label>
  <input type="password" name="new_password" required>
  <label>Yeni parol (təkrar)</label>
  <input type="password" name="confirm_password" required>
  <div class="actions">
    <button class="btn" type="submit">{{ t('save') }}</button>
  </div>
</form>
</div>
{% endblock %}
