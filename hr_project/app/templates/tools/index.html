{% extends "base.html" %}

{% block page_title %}{{ t('tools') }}{% endblock %}
{% block content %}
<div class="stats-row">

    <div class="stat-label">{{ t('change_user') }}</div>
  </a>
  <a class="stat-box" style="text-decoration:none;color:inherit;" href="{{ url_for('tools.style') }}">

    <div class="stat-label">{{ t('change_password') }}</div>
  </a>
  <a class="stat-box" style="text-decoration:none;color:inherit;" href="{{ url_for('tools.settings') }}">
    <div class="stat-label">{{ t('settings') }}</div>
  </a>
