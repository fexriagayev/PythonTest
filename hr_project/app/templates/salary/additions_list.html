{% extends "base.html" %}
{% block title %}{{ t('additions_page_title') }}{% endblock %}
{% block page_title %}{{ t('additions_page_title') }}{% endblock %}
{% block content %}

<div class="toolbar">
  {% if current_user.has_perm('SALARY', 'can_add') %}
  <button type="button" id="addAdditionBtn" class="btn">+ {{ t('additions_add_btn') }}</button>
  {% endif %}
  <input type="text" id="searchBox" class="form-control" style="max-width:280px;" placeholder="{{ t('search_all_fields') }}">
</div>

<div id="additionsGrid"></div>

{% endblock %}

{% block extra_scripts %}
<script>
document.addEventListener("DOMContentLoaded", function () {
  const canEdit = {{ 'true' if current_user.has_perm('SALARY', 'can_edit') else 'false' }};
  const canDelete = {{ 'true' if current_user.has_perm('SALARY', 'can_delete') else 'false' }};
  const canAdd = {{ 'true' if current_user.has_perm('SALARY', 'can_add') else 'false' }};

  const table = createAdvancedGrid("additionsGrid", "salary_additions", {
    ajaxURL: "{{ url_for('salary.api_additions') }}",
    pagination: true,
    paginationSize: 20,
    placeholder: "{{ t('no_data_generic') }}",
    columns: [
      { title: "{{ t('additions_col_name') }}", field: "name", headerFilter: "input" },
      { title: "{{ t('additions_col_amount_type') }}", field: "amount_type", width: 130 },
      { title: "{{ t('additions_col_amount') }}", field: "amount", width: 100, sorter: "number" },
      { title: "{{ t('additions_col_percent') }}", field: "percent", width: 90, sorter: "number" },
      { title: "{{ t('additions_col_scope') }}", field: "scope", width: 150 },
      { title: "{{ t('additions_col_valid_from') }}", field: "valid_from", width: 120, sorter: "date" },
      { title: "{{ t('additions_col_valid_to') }}", field: "valid_to", width: 120, sorter: "date" },
      { title: "{{ t('additions_col_order') }}", field: "order", headerFilter: "input" },
      { title: "{{ t('additions_col_active') }}", field: "is_active", width: 90, formatter: "tickCross" },
      { title: "{{ t('note_label') }}", field: "note", headerFilter: "input" }
    ]
  }, {
    idField: "id",
    addUrl: canAdd ? "{{ url_for('salary.add_addition') }}" : null,
    editUrlTemplate: canEdit ? "/salary/additions/edit/{id}" : null,
    deleteUrlTemplate: canDelete ? "/salary/additions/delete/{id}" : null,
  });

  wireGlobalSearch(table, document.getElementById("searchBox"), ["name", "scope", "order", "note"]);

  const addBtn = document.getElementById("addAdditionBtn");
  if (addBtn) {
    addBtn.addEventListener("click", function () {
      openFormModal("{{ url_for('salary.add_addition') }}", function () { table.setData(); });
    });
  }
});
</script>
{% endblock %}
