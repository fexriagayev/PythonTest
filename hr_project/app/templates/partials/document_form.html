{% extends "modal_form_base.html" %}
{% set form_title = t('doc_form_title_add') %}
{% set form_action = url_for('documents.add', owner_type=owner_type, owner_id=owner_id) %}
{% set form_enctype = 'multipart/form-data' %}
{% set form_max_width = '500px' %}

{% block form_fields %}
  <label>{{ t('doc_field_file') }}</label>
  <input type="file" name="file" required>

  <label>{{ t('doc_field_type') }}</label>
  <div class="dict-select-row">
    <select name="document_type_id" id="docTypeSelect_{{ owner_type }}_{{ owner_id }}">
      <option value="">{{ t('select_placeholder') }}</option>
      {% for t2 in doc_types %}
      <option value="{{ t2.id }}">{{ t2.name }}</option>
      {% endfor %}
    </select>
    <button type="button" class="btn btn-secondary"
            onclick="quickAddDictionaryItem('{{ owner_module }}', 'document_type', 'docTypeSelect_{{ owner_type }}_{{ owner_id }}', t('dict_label_document_type'))">+</button>
  </div>

  <label>{{ t('note_label') }}</label>
  <textarea name="note" rows="3" style="width:100%;max-width:100%;"></textarea>
{% endblock %}
